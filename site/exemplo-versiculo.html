  <link rel="stylesheet" href="css/versiculo-do-dia.css?v=202610151436">
  <style>
    body { margin: 0; background: #f8f6f0; color: #344e41; font-family: "Manrope", system-ui, sans-serif; }
    main { padding: 2rem 1rem; }
    h1 { font-size: 1.1rem; text-align: center; }
    .teste { max-width: 40rem; margin: 0 auto 2rem; font-size: 0.9rem; line-height: 1.7; text-align: center; }
    .teste a { color: #344e41; }
    .banner-escuro { background: #1f3329; padding: 2.5rem 1rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Exemplo isolado do componente</h1>
    <p class="teste">
      Simule um dia: <a href="?dia=100">?dia=100</a> ·
      <a href="?data=12-25">?data=12-25</a> (Natal) ·
      <a href="?data=01-01">?data=01-01</a> (Ano-Novo) ·
      <a href="?dia=366">?dia=366</a> ·
      <a href="?data=05-10">?data=05-10</a> ·
      <a href="exemplo-versiculo.html">hoje</a>
    </p>

    <!-- Variante clara -->
    <section data-versiculo-do-dia data-marca="Íntima Graça" aria-label="Versículo do dia">
      <noscript>
        <p>Salmos 46:10 — “Aquietai-vos e sabei que eu sou Deus.”</p>
      </noscript>
    </section>

    <!-- Variante escura (banners) -->
    <div class="banner-escuro">
      <section class="versiculo--escuro" data-versiculo-do-dia data-marca="Íntima Graça" aria-label="Versículo do dia">
        <noscript><p>Salmos 46:10</p></noscript>
      </section>
    </div>
  </main>

  <script type="module" src="js/versiculo-do-dia.js?v=202610151436"></script>
