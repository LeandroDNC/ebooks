<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://rkegombxusjkdveieqrw.supabase.co wss://rkegombxusjkdveieqrw.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#344E41">
  <title>Ebooks | Íntima Graça</title>
  <script src="js/tema-inicial.js?v=202610152100"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/logo-intima-graca.svg">
  <link rel="stylesheet" href="css/styles.css?v=202610151625">
  <link rel="stylesheet" href="css/admin-dashboard.css?v=202610151815">
</head>
<body class="dash">
  <!-- Acesso -->
  <main id="gate" class="gate">
    <div class="auth card">
      <img class="logo-img" src="assets/logo-intima-graca.svg" alt="Íntima Graça" width="138" height="52">
      <h1>Área do administrador</h1>
      <span class="rule" aria-hidden="true"></span>
      <form id="gate-form" novalidate>
        <div class="field"><label for="g-email">E-mail</label><input id="g-email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="g-pass">Senha</label><input id="g-pass" type="password" required autocomplete="current-password"></div>
        <button class="btn btn--primary btn--block" type="submit">Entrar</button>
        <p id="gate-msg" class="form-message" role="status"></p>
      </form>
    </div>
  </main>

  <!-- Painel -->
  <div id="app" hidden>
    <header class="dh">
      <a class="dh__logo" href="admin.html" aria-label="Íntima Graça — painel"><img src="assets/logo-intima-graca.svg" alt="Íntima Graça" width="106" height="40"></a>
      <nav class="dh__nav" aria-label="Painel">
        <a class="dh__link" href="admin.html">Painel</a>
        <a class="dh__link is-on" href="admin-ebooks.html" aria-current="page">Ebooks</a>
        <a class="dh__link" href="index.html" target="_blank" rel="noopener">Ver loja</a>
      </nav>
      <div class="dh__acoes">
        <a class="btn btn--gold btn--sm dh__novo" href="admin-ebook.html?novo=1" id="btn-novo-topo"><span data-icon="plus" data-size="18"></span> Novo ebook</a>
        <button class="dh__sair" id="btn-sair" type="button" aria-label="Sair"><span data-icon="logout" data-size="20"></span></button>
      </div>
    </header>

    <main class="dm" id="conteudo">
      <div class="lib-topo">
        <div><h1 class="lib-titulo">Ebooks</h1><p class="painel__sub" id="lib-contagem">Carregando…</p></div>
        <a class="btn btn--primary btn--sm dh__novo" href="admin-ebook.html?novo=1"><span data-icon="plus" data-size="18"></span> Novo ebook</a>
      </div>
      <section class="filtros painel" aria-label="Filtros">
        <label class="filtro filtro--busca"><span class="sr-only">Buscar</span><span data-icon="search" data-size="18"></span><input id="f-busca" type="search" placeholder="Buscar por título ou autor" autocomplete="off"></label>
        <label class="filtro"><span>Situação</span><select id="f-situacao"><option value="">Todos</option><option value="pub">Publicados</option><option value="rasc">Rascunhos</option></select></label>
        <label class="filtro"><span>Preço</span><select id="f-preco"><option value="">Todos</option><option value="gratis">Grátis</option><option value="pago">Pagos</option></select></label>
        <label class="filtro"><span>Categoria</span><select id="f-categoria"><option value="">Todas</option></select></label>
        <label class="filtro"><span>Ordenar</span><select id="f-ordem"><option value="recente">Mais recentes</option><option value="titulo">Título (A-Z)</option><option value="preco">Maior preço</option></select></label>
        <button class="btn btn--ghost btn--sm" id="f-limpar" type="button">Limpar</button>
      </section>
      <ul class="lib-grade" id="lib-grade"></ul>
      <p class="vazio" id="lib-vazio" hidden>Nenhum ebook encontrado com esses filtros.</p>
    </main>
    <a class="fab" href="admin-ebook.html?novo=1" aria-label="Novo ebook"><span data-icon="plus" data-size="26"></span></a>
  </div>

  <div class="escolha" id="escolha" hidden>
    <div class="escolha__caixa" role="dialog" aria-modal="true" aria-labelledby="esc-titulo">
      <div class="escolha__capa" id="esc-capa"></div>
      <h2 id="esc-titulo"></h2>
      <p class="painel__sub">O que você quer fazer?</p>
      <div class="escolha__botoes">
        <a class="btn btn--primary" id="esc-ver" href="#" target="_blank" rel="noopener">Ver</a>
        <a class="btn btn--gold" id="esc-editar" href="#">Editar</a>
      </div>
      <button class="btn btn--ghost btn--sm" id="esc-fechar" type="button">Cancelar</button>
    </div>
  </div>

  <script src="js/data.js?v=202610151815"></script>
  <script src="js/components.js?v=202610151815"></script>
  <script type="module" src="js/admin-ebooks.js?v=202610151815"></script>
</body>
</html>
