<html lang="pt-BR">

  <meta name="description" content="Todos os devocionais da Íntima Graça.">

  <link rel="icon" type="image/svg+xml" href="assets/logo-intima-graca.svg">
  <link rel="stylesheet" href="css/styles.css?v=202610291500">
  <link rel="stylesheet" href="css/theme.css?v=202610291500">
  <link rel="stylesheet" href="css/reader.css?v=202610291500">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/efeitos.css?v=202610292300">

</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="site-header"></div>

  <main id="conteudo" class="container section catalog">
    <div class="section-title section-title--left">
      <p class="eyebrow">Loja</p>
      <h1>Devocionais</h1>
      <span class="rule" aria-hidden="true"></span>
    </div>

    <form class="catalog-search" role="search" action="devocionais.html">
      <label class="sr-only" for="catalog-q">Buscar por título ou autoria</label>
      <input id="catalog-q" name="q" type="search" placeholder="Buscar por título ou autoria">
      <button class="btn btn--primary" type="submit">Buscar</button>
    </form>

    <nav aria-label="Categorias"><ul class="chips" id="catalog-cats"></ul></nav>
    <p class="muted" id="catalog-count" role="status"></p>
    <p class="muted" id="catalog-loading">Carregando devocionais…</p>

    <ul class="grid grid--products" id="catalog-list"></ul>
    <div class="card empty-state" id="catalog-empty" hidden>
      <p>Nenhum devocional encontrado por aqui ainda.</p>
      <a class="btn btn--secondary" href="devocionais.html">Ver todos</a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js?v=202610291500"></script>
  <script src="js/components.js?v=202610291500"></script>
  <script src="js/main.js?v=202610291500"></script>
  <script src="js/theme.js?v=202610291500"></script>
  <script type="module" src="js/catalog-page.js?v=202610291500"></script>
  <script type="module" src="js/checkout.js?v=202610291500"></script>
  <script src="js/efeitos.js?v=202610292300" defer></script>
